name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      # The @SpringBootTest context test boots the real application, which runs
      # Flyway and validates every entity mapping against the actual schema.
      # That is worth far more than mocking the database away, so CI runs a real
      # MySQL and the suite fails if a migration and an entity ever disagree.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: dms
          MYSQL_USER: dms
          MYSQL_PASSWORD: dmspass
        ports:
          # Host 3307 matches the default DB_URL, so no override is needed.
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Caches ~/.m2 keyed on pom.xml.
          cache: 'maven'

      - name: Build and test
        run: ./mvnw -B -ntp verify
        env:
          # CI runners are UTC already, but stating it means a runner change can
          # never silently reintroduce the LocalDateTime shift that stored a
          # 14:00 booking as 08:30.
          TZ: UTC

      - name: Publish test report
        # Runs even when tests fail - that is exactly when the report matters.
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dealership-service-api
          path: target/*.jar
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    # Only worth building the image once the code is known good.
    needs: build-and-test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Not pushed: no registry credentials are configured yet. This job
          # exists so a broken Dockerfile fails here rather than at deploy time.
          push: false
          load: true
          tags: dealership-service-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -u

          # Dumps everything needed to diagnose a failure from the log alone.
          dump() {
            echo "::group::containers"; docker ps -a; echo "::endgroup::"
            echo "::group::api logs";   docker logs api 2>&1 | tail -60 || true; echo "::endgroup::"
            echo "::group::mysql logs"; docker logs mysql 2>&1 | tail -30 || true; echo "::endgroup::"
          }

          docker network create dms-ci

          docker run -d --name mysql --network dms-ci \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            -e MYSQL_DATABASE=dms \
            -e MYSQL_USER=dms \
            -e MYSQL_PASSWORD=dmspass \
            mysql:8.4

          # Wait for MySQL to accept a real login, not just to be running.
          # The previous version fell through silently when this timed out, so
          # the API then started against a database that was not there and the
          # job burned three minutes polling a container that had already died.
          echo "Waiting for MySQL..."
          MYSQL_READY=no
          for i in $(seq 1 90); do
            if docker exec mysql mysqladmin ping -h localhost -prootpass --silent >/dev/null 2>&1; then
              MYSQL_READY=yes
              echo "MySQL ready after ~$((i*2))s"
              break
            fi
            sleep 2
          done
          if [ "$MYSQL_READY" != "yes" ]; then
            echo "::error::MySQL never became ready"
            dump
            exit 1
          fi

          docker run -d --name api --network dms-ci -p 8080:8080 \
            -e DB_URL='jdbc:mysql://mysql:3306/dms?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC' \
            -e DB_USERNAME=dms \
            -e DB_PASSWORD=dmspass \
            dealership-service-api:${{ github.sha }}

          echo "Waiting for the API..."
          API_UP=no
          for i in $(seq 1 90); do
            # Bail out immediately if the container has exited. Polling a dead
            # container until the timeout tells you nothing and wastes minutes.
            if [ "$(docker inspect -f '{{.State.Running}}' api 2>/dev/null)" != "true" ]; then
              echo "::error::API container exited during startup"
              dump
              exit 1
            fi
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              API_UP=yes
              echo "API is UP after ~$((i*3))s"
              break
            fi
            sleep 3
          done
          if [ "$API_UP" != "yes" ]; then
            echo "::error::API never became healthy"
            dump
            exit 1
          fi

          # Prove the container serves real traffic, not merely that it booted.
          echo "Checking login..."
          if curl -fsS -X POST http://localhost:8080/api/auth/login \
               -H 'Content-Type: application/json' \
               -d '{"email":"advisor@dms.local","password":"password123"}' \
               | grep -q accessToken; then
            echo "login OK"
          else
            echo "::error::login failed against the built image"
            dump
            exit 1
          fi

          # And that the double-booking guard survives into the image.
          echo "Checking the booking conflict guard..."
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"advisor@dms.local","password":"password123"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')

          BOOK='{"vehicleId":1,"bayId":1,"scheduledStart":"2030-04-01T09:00:00","scheduledEnd":"2030-04-01T10:00:00"}'
          CLASH='{"vehicleId":1,"bayId":1,"scheduledStart":"2030-04-01T09:30:00","scheduledEnd":"2030-04-01T10:30:00"}'

          FIRST=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/appointments \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BOOK")
          SECOND=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/appointments \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$CLASH")

          echo "first booking: $FIRST   overlapping booking: $SECOND"
          if [ "$FIRST" != "201" ] || [ "$SECOND" != "409" ]; then
            echo "::error::expected 201 then 409, got $FIRST then $SECOND"
            dump
            exit 1
          fi
          echo "double-booking guard OK"
