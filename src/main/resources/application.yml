# Every externalised value below follows the ${ENV_VAR:default} form. The
# defaults are the local Docker-Compose setup, so `./mvnw spring-boot:run` works
# with no environment at all, while a deployed instance overrides each one.
spring:
  application:
    name: dealership-service-api

  datasource:
    # connectionTimeZone=UTC pairs with the TimeZone.setDefault(UTC) in
    # DealershipServiceApiApplication. JVM zone, connection zone and the MySQL
    # container all being UTC is what stops the driver from shifting
    # LocalDateTime values on the way into the DATETIME columns.
    url: ${DB_URL:jdbc:mysql://localhost:3307/dms?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${DB_USERNAME:dms}
    password: ${DB_PASSWORD:dmspass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          # created_at/opened_at/closed_at are TIMESTAMP mapped to Instant, and
          # are stored as UTC regardless of the server's local zone.
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # DEV DEFAULT ONLY. It is committed deliberately so a fresh clone runs, and
    # it decodes to the literal text "fake-dev-secret-change-me-before-deploy-256"
    # - it protects nothing.
    #
    # Any deployed instance MUST set JWT_SECRET to a real base64-encoded value of
    # at least 256 bits, e.g.
    #     openssl rand -base64 48
    # Keys.hmacShaKeyFor rejects anything shorter, so a weak value fails fast at
    # startup rather than silently issuing forgeable tokens.
    secret: ${JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95LTI1Ng==}
    access-token-minutes: ${JWT_TTL_MINUTES:60}
  billing:
    # 18% GST, applied to parts + labour when an RO is repriced.
    tax-rate: ${TAX_RATE:0.18}

management:
  endpoints:
    web:
      exposure:
        # health only. Never expose env or configprops publicly: they would
        # print the datasource password and the JWT secret.
        include: health
  endpoint:
    health:
      # Docker and the load balancer probe these; they must not require auth.
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL_LEVEL:INFO}
    org.springframework.security: INFO
