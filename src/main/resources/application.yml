spring:
  application:
    name: dealership-service-api

  datasource:
    # connectionTimeZone=UTC pairs with the TimeZone.setDefault(UTC) in
    # DealershipServiceApiApplication. JVM zone, connection zone and the MySQL
    # container all being UTC is what stops the driver from shifting
    # LocalDateTime values on the way into the DATETIME columns.
    url: jdbc:mysql://localhost:3307/dms?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: dms
    password: dmspass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          # created_at/opened_at/closed_at are TIMESTAMP mapped to Instant, and
          # are stored as UTC regardless of the server's local zone.
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # dev-only secret; move to an env var before any deploy
    secret: ZmFrZS1kZXYtc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95LTI1Ng==
    access-token-minutes: 60
  billing:
    # 18% GST, applied to parts + labour when an RO is repriced.
    tax-rate: 0.18

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.security: INFO
