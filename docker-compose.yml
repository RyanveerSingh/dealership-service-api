services:
  mysql:
    image: mysql:8.4
    container_name: dms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dms
      MYSQL_USER: dms
      MYSQL_PASSWORD: dmspass
    ports:
      - "3307:3306"
    volumes:
      - dms-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dms-data:
